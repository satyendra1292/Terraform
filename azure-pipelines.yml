trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

- task: AzureCLI@2
  displayName: 'Terraform Deploy'
  inputs:
    azureSubscription: 'new'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      terraform version

      cd "$(System.DefaultWorkingDirectory)/terraform RG"

      pwd
      ls -la

      terraform init
      terraform validate
      terraform plan
      terraform apply -auto-approve
